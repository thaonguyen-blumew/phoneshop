<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Đặt lại mật khẩu — PhoneShop</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
    .auth-card{width:100%;max-width:420px;background:var(--bg-card);border-radius:var(--radius-xl);padding:32px 24px;box-shadow:var(--shadow-lg)}
    .auth-logo{text-align:center;margin-bottom:24px}
    .auth-logo h1{font-size:1.5rem}
    .auth-logo p{color:var(--text-secondary);font-size:0.875rem;margin-top:4px}
    .alert{padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.875rem}
    .alert-error{background:#fee2e2;color:#b91c1c;border:1px solid #f87171}
    .hint-text{font-size:0.75rem;color:var(--text-muted);margin-top:4px}
    .strength-bar{height:4px;border-radius:2px;background:var(--border-light);margin-top:6px;overflow:hidden}
    .strength-fill{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;width:0}
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>Phone<span style="color:var(--accent)">Shop</span></h1>
        <p>Tạo mật khẩu mới</p>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
      </div>

      <!-- Form đặt lại mật khẩu (chỉ hiện khi có token hợp lệ) -->
      <div th:if="${token != null}">
        <form th:action="@{/reset-password}" method="post" class="flex-col gap-16" onsubmit="return validateForm()">
          <input type="hidden" name="token" th:value="${token}">

          <div class="form-group">
            <label class="form-label">Mật khẩu mới</label>
            <input type="password" name="password" id="password" class="form-input"
                   placeholder="Tối thiểu 6 ký tự" required minlength="6"
                   oninput="checkStrength(this.value)">
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <p class="hint-text" id="strengthLabel">Tối thiểu 6 ký tự</p>
          </div>

          <div class="form-group">
            <label class="form-label">Xác nhận mật khẩu</label>
            <input type="password" name="confirmPassword" id="confirmPassword" class="form-input"
                   placeholder="Nhập lại mật khẩu" required minlength="6">
            <p class="hint-text" id="matchLabel" style="display:none;color:var(--danger)">Mật khẩu không khớp</p>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i class="fas fa-lock"></i> Đặt lại mật khẩu
          </button>
        </form>
      </div>

      <!-- Không có token hợp lệ -->
      <div th:unless="${token != null}" th:if="${error == null}">
        <p class="text-sm text-muted text-center">Link không hợp lệ hoặc đã hết hạn.</p>
        <a th:href="@{/forgot-password}" class="btn btn-primary btn-block mt-16">Yêu cầu link mới</a>
      </div>

      <div class="text-center mt-20">
        <a th:href="@{/login}" class="text-sm" style="color:var(--text-secondary)">
          <i class="fas fa-arrow-left"></i> Quay lại đăng nhập
        </a>
      </div>
    </div>
  </div>

  <script>
    function checkStrength(val) {
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      if (!fill) return;
      const len = val.length;
      if (len === 0) { fill.style.width='0%'; fill.style.background=''; label.textContent='Tối thiểu 6 ký tự'; return; }
      if (len < 6) { fill.style.width='25%'; fill.style.background='var(--danger)'; label.textContent='Quá ngắn'; return; }
      if (len < 8) { fill.style.width='50%'; fill.style.background='var(--warning)'; label.textContent='Tạm được'; return; }
      if (len < 12) { fill.style.width='75%'; fill.style.background='var(--accent)'; label.textContent='Tốt'; return; }
      fill.style.width='100%'; fill.style.background='var(--success)'; label.textContent='Rất mạnh';
    }

    function validateForm() {
      const pw = document.getElementById('password').value;
      const cpw = document.getElementById('confirmPassword').value;
      const matchLabel = document.getElementById('matchLabel');
      if (pw !== cpw) {
        matchLabel.style.display = 'block';
        return false;
      }
      matchLabel.style.display = 'none';
      return true;
    }

    document.getElementById('confirmPassword')?.addEventListener('input', function() {
      const pw = document.getElementById('password').value;
      const label = document.getElementById('matchLabel');
      label.style.display = pw !== this.value && this.value.length > 0 ? 'block' : 'none';
    });
  </script>
</body>
</html>
