<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Tài khoản — PhoneShop</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Profile specific styles (if any) */
    .hidden { display: none !important; }
    .alert { padding: 12px; border-radius: 4px; margin-bottom: 16px; font-size: 0.875rem; text-align: center; }
    .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #f87171; }
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #4ade80; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="mobile-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
      <a th:href="@{/}" class="header-logo">PHONE<span style="color:var(--accent-gold)">SHOP</span></a>
      <nav class="nav-desktop">
        <a th:href="@{/}" class="nav-link">Trang chủ</a>
        <a th:href="@{/products}" class="nav-link">Sản phẩm</a>
        <a href="#" class="nav-link">Khuyến mãi</a>
        <a href="#" class="nav-link">Liên hệ</a>
      </nav>
    </div>
    <div class="header-actions">
      <a th:href="@{/cart}" class="header-icon"><i class="fas fa-shopping-bag"></i></a>
      <a th:href="@{/profile}" class="header-icon active"><i class="fas fa-user-circle"></i></a>
    </div>
  </header>

  <main class="page">
    <div class="profile-layout">
      <aside class="profile-sidebar desktop-only">
        <div class="profile-header" style="background: var(--navy-primary); color: white; padding: 30px 20px; text-align: center;">
          <div class="profile-avatar" style="width: 80px; height: 80px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 2rem; border: 2px solid var(--accent-gold);">
            <i class="fas fa-user" style="color: var(--accent-gold);"></i>
          </div>
          <h3 th:text="${customer != null ? customer.fullName : 'Khách hàng'}" style="font-size: 1.1rem; margin-bottom: 5px;">Họ tên</h3>
          <p th:text="${customer != null ? customer.email : ''}" style="font-size: 0.8rem; opacity: 0.7;">email@example.com</p>
        </div>

        <div class="profile-section" style="padding: 20px 0;">
          <a th:href="@{/profile(tab='info')}" class="menu-item" 
             th:styleappend="${activeTab == 'info' ? 'border-left: 4px solid var(--accent-gold); background: var(--bg-light); color: var(--navy-primary); font-weight: 700;' : ''}">
             <i class="fas fa-user-edit" th:style="${activeTab == 'info' ? 'color: var(--navy-primary);' : ''}"></i> Thông tin cá nhân
          </a>
          <a th:href="@{/orders}" class="menu-item">
            <i class="fas fa-box"></i> Đơn hàng của tôi
          </a>
          <a th:href="@{/profile(tab='addresses')}" class="menu-item"
             th:styleappend="${activeTab == 'addresses' ? 'border-left: 4px solid var(--accent-gold); background: var(--bg-light); color: var(--navy-primary); font-weight: 700;' : ''}">
             <i class="fas fa-map-marker-alt" th:style="${activeTab == 'addresses' ? 'color: var(--navy-primary);' : ''}"></i> Sổ địa chỉ
          </a>
          <a th:href="@{/profile(tab='password')}" class="menu-item"
             th:styleappend="${activeTab == 'password' ? 'border-left: 4px solid var(--accent-gold); background: var(--bg-light); color: var(--navy-primary); font-weight: 700;' : ''}">
             <i class="fas fa-lock" th:style="${activeTab == 'password' ? 'color: var(--navy-primary);' : ''}"></i> Đổi mật khẩu
          </a>
          
          <form th:action="@{/logout}" method="post" style="padding: 15px 20px;">
            <button type="submit" style="width: 100%; padding: 12px; background: none; border: 1.5px solid #ff4d4f; color: #ff4d4f; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s;">
              <i class="fas fa-sign-out-alt"></i> ĐĂNG XUẤT
            </button>
          </form>
        </div>
      </aside>

      <div class="profile-main">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="cart-card" style="padding: 30px; min-height: 500px;">
          <!-- Info Tab -->
          <div th:if="${activeTab == 'info'}">
            <h3 class="mb-24" style="color: var(--navy-primary); border-bottom: 2px solid var(--bg-light); padding-bottom: 15px;">Thông tin cá nhân</h3>
            <form th:action="@{/profile/update}" method="post" class="flex flex-col gap-20">
              <div class="form-group">
                <label class="form-label" style="font-weight: 700; color: var(--navy-primary); margin-bottom: 8px;">Họ và tên</label>
                <input type="text" name="fullName" class="form-input" th:value="${customer.fullName}" required style="padding: 14px 18px; border-radius: 10px;">
              </div>
              <div class="form-group">
                <label class="form-label" style="font-weight: 700; color: var(--navy-primary); margin-bottom: 8px;">Email</label>
                <input type="email" class="form-input" th:value="${customer.email}" disabled style="background: var(--bg-light); padding: 14px 18px; border-radius: 10px; cursor: not-allowed; opacity: 0.8;">
              </div>
              <div class="form-group">
                <label class="form-label" style="font-weight: 700; color: var(--navy-primary); margin-bottom: 8px;">Số điện thoại</label>
                <input type="tel" name="phone" class="form-input" th:value="${customer.phone}" style="padding: 14px 18px; border-radius: 10px;">
              </div>
              <div style="margin-top: 10px;">
                <button type="submit" class="btn btn-primary" style="padding: 14px 35px; border-radius: 50px; font-weight: 700; box-shadow: 0 4px 15px rgba(0,35,71,0.2);">CẬP NHẬT THÔNG TIN</button>
              </div>
            </form>
          </div>

          <!-- Password Tab -->
          <div th:if="${activeTab == 'password'}">
            <h3 class="mb-24" style="color: var(--navy-primary); border-bottom: 2px solid var(--bg-light); padding-bottom: 15px;">Đổi mật khẩu</h3>
            <form th:action="@{/profile/password}" method="post" class="flex flex-col gap-20">
              <div class="form-group">
                <label class="form-label" style="font-weight: 700; color: var(--navy-primary); margin-bottom: 8px;">Mật khẩu hiện tại</label>
                <input type="password" name="oldPassword" class="form-input" required style="padding: 14px 18px; border-radius: 10px;">
              </div>
              <div class="form-group">
                <label class="form-label" style="font-weight: 700; color: var(--navy-primary); margin-bottom: 8px;">Mật khẩu mới</label>
                <input type="password" name="newPassword" class="form-input" required minlength="6" style="padding: 14px 18px; border-radius: 10px;">
              </div>
              <div class="form-group">
                <label class="form-label" style="font-weight: 700; color: var(--navy-primary); margin-bottom: 8px;">Xác nhận mật khẩu mới</label>
                <input type="password" name="confirmPassword" class="form-input" required minlength="6" style="padding: 14px 18px; border-radius: 10px;">
              </div>
              <div style="margin-top: 10px;">
                <button type="submit" class="btn btn-primary" style="padding: 14px 35px; border-radius: 50px; font-weight: 700; box-shadow: 0 4px 15px rgba(0,35,71,0.2);">ĐỔI MẬT KHẨU</button>
              </div>
            </form>
          </div>

          <!-- Addresses Tab -->
          <div th:if="${activeTab == 'addresses'}">
            <div class="flex justify-between items-center mb-24" style="border-bottom: 2px solid var(--bg-light); padding-bottom: 15px;">
              <h3 style="color: var(--navy-primary);">Sổ địa chỉ</h3>
              <button class="btn btn-primary btn-sm" onclick="showAddressForm()" style="border-radius: 50px; padding: 8px 20px;"><i class="fas fa-plus"></i> Thêm địa chỉ mới</button>
            </div>
            
            <form th:action="@{/profile/addresses/add}" method="post" id="addressForm" class="flex flex-col gap-20 hidden" style="padding: 20px; background: var(--bg-light); border-radius: 15px; margin-bottom: 30px;">
              <div class="form-group">
                <label class="form-label" style="font-weight: 700;">Địa chỉ (Số nhà, đường)</label>
                <input type="text" name="street" id="addrStreet" class="form-input" required style="padding: 12px 16px;">
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group"><label class="form-label" style="font-weight: 700;">Phường/Xã</label><input type="text" name="ward" id="addrWard" class="form-input" style="padding: 12px 16px;"></div>
                <div class="form-group"><label class="form-label" style="font-weight: 700;">Quận/Huyện</label><input type="text" name="district" id="addrDistrict" class="form-input" style="padding: 12px 16px;"></div>
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group"><label class="form-label" style="font-weight: 700;">Tỉnh/Thành phố</label><input type="text" name="city" id="addrCity" class="form-input" required style="padding: 12px 16px;"></div>
                <div class="form-group"><label class="form-label" style="font-weight: 700;">Số điện thoại nhận hàng</label><input type="tel" name="phone" id="addrPhone" class="form-input" style="padding: 12px 16px;"></div>
              </div>
              <label class="text-sm flex items-center gap-8" style="cursor: pointer;"><input type="checkbox" name="setDefault" value="true" id="addrDefault" style="width: 18px; height: 18px; accent-color: var(--navy-primary);"> Đặt làm địa chỉ mặc định</label>
              <div class="flex gap-12 mt-10">
                <button type="submit" class="btn btn-primary" style="padding: 10px 25px; border-radius: 50px;">Lưu địa chỉ</button>
                <button type="button" class="btn btn-outline" onclick="hideAddressForm()" style="padding: 10px 25px; border-radius: 50px;">Hủy bỏ</button>
              </div>
            </form>

            <div id="addressList">
              <div th:if="${addresses == null || addresses.isEmpty()}" class="empty-state" style="padding: 40px 0;">
                <i class="fas fa-map-marked-alt" style="font-size: 3rem; color: var(--border-color); margin-bottom: 15px;"></i>
                <p class="text-muted">Bạn chưa lưu địa chỉ nào.</p>
              </div>
              <div th:each="a : ${addresses}" style="padding: 20px; border: 1.5px solid var(--bg-light); border-radius: 12px; margin-bottom: 15px; position: relative; transition: all 0.3s;" onmouseover="this.style.borderColor='var(--accent-gold)'" onmouseout="this.style.borderColor='var(--bg-light)'">
                <div class="flex items-center gap-10 mb-8">
                  <i class="fas fa-map-marker-alt" style="color: var(--accent-gold);"></i>
                  <div class="fw-700" th:text="${(a.street != null ? a.street : '') + (a.ward != null ? ', ' + a.ward : '') + (a.district != null ? ', ' + a.district : '') + (a.city != null ? ', ' + a.city : '')}"></div>
                </div>
                <div th:if="${a.phone != null}" class="text-sm text-muted mb-8"><i class="fas fa-phone-alt" style="font-size: 0.8rem; margin-right: 5px;"></i> <span th:text="${a.phone}"></span></div>
                <span th:if="${a.isDefault}" style="background: rgba(197, 160, 89, 0.1); color: var(--accent-gold); padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--accent-gold);">MẶC ĐỊNH</span>
                
                <div class="flex gap-12 mt-16">
                  <button class="btn btn-outline btn-sm" style="border-radius: 50px;"
                          th:data-id="${a.addressId}" th:data-street="${a.street}" th:data-ward="${a.ward}"
                          th:data-district="${a.district}" th:data-city="${a.city}" th:data-phone="${a.phone}"
                          th:data-isdefault="${a.isDefault}" onclick="editAddress(this)">Chỉnh sửa</button>
                  
                  <form th:if="${!a.isDefault}" th:action="@{/profile/addresses/{id}/default(id=${a.addressId})}" method="post" style="margin:0;">
                      <button type="submit" class="btn btn-outline btn-sm" style="border-radius: 50px;">Đặt mặc định</button>
                  </form>

                  <form th:action="@{/profile/addresses/{id}/delete(id=${a.addressId})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa địa chỉ này?');" style="margin:0;">
                      <button type="submit" class="btn btn-sm" style="color:var(--danger); font-weight: 700;">Xóa</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a th:href="@{/}" class="bottom-nav-item"><i class="fas fa-home"></i><span>Trang chủ</span></a>
    <a th:href="@{/products}" class="bottom-nav-item"><i class="fas fa-th-large"></i><span>Sản phẩm</span></a>
    <a th:href="@{/cart}" class="bottom-nav-item"><i class="fas fa-shopping-bag"></i><span>Giỏ hàng</span></a>
    <a th:href="@{/orders}" class="bottom-nav-item"><i class="fas fa-box"></i><span>Đơn hàng</span></a>
    <a th:href="@{/profile}" class="bottom-nav-item active"><i class="fas fa-user"></i><span>Tài khoản</span></a>
  </nav>

  <script>
    function showAddressForm() {
      const form = document.getElementById('addressForm');
      form.action = '/profile/addresses/add';
      form.reset();
      form.classList.remove('hidden');
    }

    function editAddress(btn) {
      const form = document.getElementById('addressForm');
      form.action = '/profile/addresses/' + btn.dataset.id + '/edit';
      form.classList.remove('hidden');
      
      document.getElementById('addrStreet').value = btn.dataset.street || '';
      document.getElementById('addrWard').value = btn.dataset.ward || '';
      document.getElementById('addrDistrict').value = btn.dataset.district || '';
      document.getElementById('addrCity').value = btn.dataset.city || '';
      document.getElementById('addrPhone').value = btn.dataset.phone || '';
      document.getElementById('addrDefault').checked = btn.dataset.isdefault === 'true';
    }

    function hideAddressForm() {
      const form = document.getElementById('addressForm');
      form.reset();
      form.classList.add('hidden');
    }
  </script>
</body>
</html>
